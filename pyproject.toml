[project]
name = "ml-service2"
version = "2.0.0"
description = "Institutional-grade standalone ML microservice for AlphaForge trading platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
    # ── Web Framework ──────────────────────────────────────────────
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",

    # ── Data / Numerics ────────────────────────────────────────────
    "numpy==1.26.4",
    "pandas==2.2.3",
    "scipy==1.14.1",
    "joblib==1.4.2",

    # ── ML / Tree Models ───────────────────────────────────────────
    "scikit-learn==1.5.2",
    "xgboost==2.1.3",
    "lightgbm==4.6.0",
    "catboost==1.2.7",

    # ── Deep RL ───────────────────────────────────────────────────
    "stable-baselines3==2.4.0",
    "gymnasium==1.0.0",
    "finrl==0.3.7",

    # ── Explainability ─────────────────────────────────────────────
    "shap==0.46.0",

    # ── Portfolio Optimisation ─────────────────────────────────────
    "riskfolio-lib==6.3.0",
    "pyportfolioopt==1.5.5",

    # ── Schemas / Config ───────────────────────────────────────────
    "pydantic==2.10.3",
    "pydantic-settings==2.7.0",
    "python-dotenv==1.2.2",

    # ── HTTP Client ────────────────────────────────────────────────
    "httpx==0.28.1",
    "tenacity==9.0.0",

    # ── Cache / Messaging ──────────────────────────────────────────
    "redis[hiredis]==5.2.1",

    # ── gRPC ──────────────────────────────────────────────────────
    "grpcio==1.69.0",
    "grpcio-tools==1.69.0",

    # ── Experiment Tracking ────────────────────────────────────────
    "mlflow==3.16.0",

    # ── HPO ───────────────────────────────────────────────────────
    "optuna==4.1.0",

    # ── Logging ───────────────────────────────────────────────────
    "structlog==24.4.0",

    # ── Technical Indicators ───────────────────────────────────────
    "ta==0.11.0",

    # ── Drift Monitoring ───────────────────────────────────────────
    "evidently==0.5.0",
    "nannyml==0.13.0",

    # ── LLM / NLP ─────────────────────────────────────────────────
    "langchain==1.3.9",
    "langchain-community==0.3.27",
    "langchain-huggingface==0.1.2",
    "transformers==5.10.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==0.24.0",
    "pytest-cov==6.0.0",
    "pytest-benchmark==5.1.0",
    "pytest-timeout==2.3.1",
    "hypothesis==6.123.4",
    "ruff==0.8.4",
    "mypy==1.13.0",
    "pre-commit==4.0.1",
    # Type stubs
    "types-redis==4.6.0.20241004",
    "pandas-stubs==2.2.3.241126",
    "types-PyYAML==6.0.12.20241230",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# ── Ruff ──────────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "PTH", "RUF"]
ignore = ["E501", "B008", "N818"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "D", "ANN"]

# ── Mypy ──────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = true
exclude = ["tests/", "protos/"]
# Allow untyped third-party libs that ship no stubs
[[tool.mypy.overrides]]
module = [
    "finrl.*",
    "qlib.*",
    "ta.*",
    "shap.*",
    "optuna.*",
    "evidently.*",
    "nannyml.*",
    "langchain.*",
    "langchain_community.*",
    "langchain_huggingface.*",
    "transformers.*",
    "catboost.*",
    "riskfolio.*",
    "pypfopt.*",
    "stable_baselines3.*",
    "gymnasium.*",
    "grpc.*",
    "mlflow.*",
    "structlog.*",
]
ignore_missing_imports = true

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing"
timeout = 120
markers = [
    "unit: fast isolated unit tests (no I/O)",
    "integration: tests that require running services",
    "slow: tests that take > 5 seconds",
    "pit: Point-In-Time correctness tests",
    "tdd: TDD red-phase tests expected to drive implementation",
]

# ── Coverage ──────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["src"]
omit = ["src/**/__init__.py"]
# Single-process data file. Prevents orphaned `.coverage.<host>.<pid>.*`
# fragments from piling up when a test run is interrupted/killed before
# coverage can combine them.
parallel = false
# Wipe stale data at the start of every run so nothing accumulates.
data_file = ".coverage"

[tool.coverage.report]
fail_under = 90
show_missing = true

# ── Scripts (proto generation) ────────────────────────────────────────────────
[tool.hatch.envs.default.scripts]
generate-stubs = "bash protos/generate_stubs.sh"
serve = "uvicorn src.main:app --host 0.0.0.0 --port 8100 --reload"
serve-prod = "uvicorn src.main:app --host 0.0.0.0 --port 8100 --workers 4"
