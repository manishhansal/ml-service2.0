# ────────────────────────────────────────────────────────────────────────────
# ml-service2.0 — Development stack
#
# Services:
#   ml-service  — The ML microservice built from the `dev` stage; hot-reloads
#                 on source changes via the ./src volume mount.
#   redis       — Feature + news context cache (TTL-based).
#   mlflow      — Experiment tracking UI and model registry.
#
# Usage:
#   cp .env.example .env        # fill in secrets
#   docker-compose up
#
# The service will be available at http://localhost:8100
# MLflow UI will be available at http://localhost:5000
# ────────────────────────────────────────────────────────────────────────────
version: "3.9"

services:

  # ── ml-service ──────────────────────────────────────────────────────────────
  ml-service:
    build:
      context: .
      target: dev
    ports:
      - "8100:8100"
    environment:
      - ML_SERVICE_API_KEY=${ML_SERVICE_API_KEY:-dev-key}
      - DATA_SERVICE_API_KEY=${DATA_SERVICE_API_KEY:-dev-data-key}
      - DATA_SERVICE_2_URL=${DATA_SERVICE_2_URL:-http://host.docker.internal:8200}
      - SENTINEL_PULSE_URL=${SENTINEL_PULSE_URL:-http://host.docker.internal:3001}
      - REDIS_URL=redis://redis:6379
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - DEPLOYMENT_MODE=research
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      # Hot-reload: source and test trees are bind-mounted so uvicorn --reload
      # picks up changes without a container rebuild.
      - ./src:/app/src
      - ./tests:/app/tests
      # Persist model artifacts across container restarts
      - ./artifacts:/app/artifacts
    depends_on:
      redis:
        condition: service_healthy
    command: uvicorn src.main:app --host 0.0.0.0 --port 8100 --reload
    # Allow the container to reach services on the host machine
    # (e.g. data-service2.0 at host.docker.internal:8200)
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── MLflow ───────────────────────────────────────────────────────────────────
  # Tracking server with a local SQLite backend and filesystem artifact store.
  # Data is persisted in ./mlruns on the host.
  mlflow:
    image: python:3.11-slim
    command: >
      sh -c "pip install mlflow==2.19.0 &&
             mlflow server --host 0.0.0.0 --port 5000
             --backend-store-uri sqlite:///mlruns/mlflow.db
             --default-artifact-root /mlruns/artifacts"
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlruns
