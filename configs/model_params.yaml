# Model hyper-parameter defaults and constraints for ml-service2.0.
# These serve as Optuna search-space baselines when no MLflow run has been
# logged for a given model.  Production HPO results override these values.

price_forecaster:
  model_type: lightgbm  # lightgbm | xgboost | catboost
  n_estimators: 500
  learning_rate: 0.05
  max_depth: 6
  num_leaves: 63
  subsample: 0.8
  colsample_bytree: 0.8
  reg_alpha: 0.1
  reg_lambda: 1.0
  min_child_samples: 50

regime_classifier:
  model_type: lightgbm
  n_estimators: 300
  max_depth: 5
  num_leaves: 31
  learning_rate: 0.05

stock_ranker:
  model_type: lightgbm
  objective: lambdarank
  n_estimators: 400
  learning_rate: 0.05
  num_leaves: 63

risk_predictor:
  model_type: xgboost
  n_estimators: 300
  max_depth: 6
  learning_rate: 0.05
  subsample: 0.8

rl_execution_agent:
  algorithm: PPO  # PPO | SAC | A2C
  total_timesteps: 100_000
  learning_rate: 3.0e-4
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  gamma: 0.99

# Optuna HPO settings
hpo:
  n_trials: 50
  timeout_seconds: 3600
  pruner: MedianPruner
  sampler: TPESampler
